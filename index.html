<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <header class="app-header">
      <h1>Today's tasks</h1>
      <p class="subtitle" id="taskCount">No tasks yet</p>
    </header>

    <form id="taskForm" class="task-form">
      <input
        type="text"
        id="taskInput"
        placeholder="What do you need to do?"
        autocomplete="off"
        maxlength="120"
      >
      <button type="submit">Add</button>
    </form>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul class="task-list" id="taskList">
      <!-- Tasks render here -->
    </ul>

    <p class="empty-state" id="emptyState">Nothing here yet. Add your first task above.</p>

    <button class="clear-btn" id="clearCompleted">Clear completed</button>
    <footer>@ Teslim Abdulwahab</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
